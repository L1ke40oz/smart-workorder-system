# Only for local development. Production must activate the mysql profile.
spring:
  datasource:
    url: jdbc:h2:file:./data/workorders;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
app:
  security:
    secret: ${JWT_SECRET:local-development-only-change-before-deploy-2026}
  bootstrap:
    admin-password: ${ADMIN_PASSWORD:Admin123456!}
